<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno (ELN) - BioTrack 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-custom text-custom antialiased">
    <div id="app-container" class="flex flex-col h-screen">
        <header id="main-header" class="card-custom shadow-md p-3 flex justify-between items-center w-full z-20 flex-shrink-0 border-b border-custom"></header>
        <div class="flex flex-1 overflow-hidden">
            <aside id="main-sidebar" class="w-20 lg:w-64 card-custom shadow-lg flex flex-col flex-shrink-0 transition-all duration-300"></aside>
            
            <main class="flex-1 p-6 overflow-y-auto bg-custom">
                <div id="eln" class="page">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-custom">Caderno (ELN)</h2>
                        <button id="addElnEntryBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"><i class="fas fa-plus mr-2"></i>Nova Entrada</button>
                    </div>
                    <div class="card-custom p-6 rounded-lg shadow-md overflow-x-auto">
                        <table class="w-full text-left text-sm"><thead class="border-b border-custom"><tr><th class="p-2">Título</th><th class="p-2">Autor</th><th class="p-2">Data</th><th class="p-2">Status</th><th class="p-2 text-right">Ações</th></tr></thead><tbody id="elnTableBody"></tbody></table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div id="elnModal" class="fixed inset-0 flex items-center justify-center hidden modal-backdrop z-30">
        <div class="card-custom rounded-lg shadow-xl p-8 w-full max-w-3xl">
            <h3 class="text-2xl font-bold mb-4 text-custom">Nova Entrada no Caderno</h3>
            <form id="elnForm">
                 <input type="text" id="elnTitle" placeholder="Título da Entrada" class="w-full px-3 py-2 mb-4 border border-custom rounded-lg bg-custom text-custom" required>
                 <div class="mb-2 p-2 bg-custom rounded-lg border border-custom flex items-center space-x-4">
                     <button type="button" class="eln-tool-btn px-3 py-1 rounded-md hover:bg-green-500/20" data-tool="timer"><i class="fas fa-clock mr-1"></i>Timer</button>
                     <span id="eln-timer-display" class="font-mono text-sm">00:00:00</span>
                 </div>
                 <textarea id="elnContent" rows="10" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom" placeholder="Descreva o experimento..."></textarea>
                <div class="flex justify-end space-x-4 mt-6">
                    <button type="button" class="close-modal-btn px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/eln.js"></script>
</body>
</html>
