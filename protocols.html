<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolos - BioTrack 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-custom text-custom antialiased">
    <div id="app-container" class="flex flex-col h-screen">
        <header id="main-header" class="card-custom shadow-md p-3 flex justify-between items-center w-full z-20 flex-shrink-0 border-b border-custom"></header>
        <div class="flex flex-1 overflow-hidden">
            <aside id="main-sidebar" class="w-20 lg:w-64 card-custom shadow-lg flex flex-col flex-shrink-0 transition-all duration-300"></aside>

            <main class="flex-1 p-6 overflow-y-auto bg-custom">
                <div id="protocols" class="page">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-custom">Protocolos</h2>
                        <button id="addProtocolBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"><i class="fas fa-plus mr-2"></i>Novo Protocolo</button>
                    </div>
                    <div class="card-custom p-6 rounded-lg shadow-md overflow-x-auto">
                        <table class="w-full text-left text-sm"><thead class="border-b border-custom"><tr><th class="p-2">Nome</th><th class="p-2">Categoria</th><th class="p-2">Versão</th><th class="p-2">Autor</th><th class="p-2 text-right">Ações</th></tr></thead><tbody id="protocolTableBody"></tbody></table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div id="protocolModal" class="fixed inset-0 flex items-center justify-center hidden modal-backdrop z-30">
        <div class="card-custom rounded-lg shadow-xl p-8 w-full max-w-2xl">
            <h3 class="text-2xl font-bold mb-4 text-custom">Adicionar/Editar Protocolo</h3>
            <form id="protocolForm">
                 <input type="text" id="protocolName" placeholder="Nome do Protocolo" class="w-full px-3 py-2 mb-4 border border-custom rounded-lg bg-custom text-custom" required>
                 <input type="text" id="protocolCategory" placeholder="Categoria" class="w-full px-3 py-2 mb-4 border border-custom rounded-lg bg-custom text-custom" required>
                 <textarea id="protocolContent" rows="8" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom" placeholder="Descreva os passos do protocolo..."></textarea>
                <div class="flex justify-end space-x-4 mt-6">
                    <button type="button" class="close-modal-btn px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Salvar Protocolo</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/protocols.js"></script>
</body>
</html>
