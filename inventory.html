<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - BioTrack 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-custom text-custom antialiased">
    <div id="app-container" class="flex flex-col h-screen">
        <header id="main-header" class="card-custom shadow-md p-3 flex justify-between items-center w-full z-20 flex-shrink-0 border-b border-custom"></header>
        <div class="flex flex-1 overflow-hidden">
            <aside id="main-sidebar" class="w-20 lg:w-64 card-custom shadow-lg flex flex-col flex-shrink-0 transition-all duration-300"></aside>
            
            <main class="flex-1 p-6 overflow-y-auto bg-custom">
                 <div id="inventory" class="page">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-custom">Inventário (LIMS)</h2>
                        <button id="addInventoryItemBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"><i class="fas fa-plus mr-2"></i>Novo Item</button>
                    </div>
                    <div class="card-custom p-6 rounded-lg shadow-md overflow-x-auto">
                         <table class="w-full text-left text-sm"><thead class="border-b border-custom"><tr><th class="p-2">ID</th><th class="p-2">Nome</th><th class="p-2">Lote</th><th class="p-2">Validade</th><th class="p-2">Localização</th><th class="p-2">Quantidade</th></tr></thead><tbody id="inventoryTableBody"></tbody></table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div id="inventoryModal" class="fixed inset-0 flex items-center justify-center hidden modal-backdrop z-30">
        <div class="card-custom rounded-lg shadow-xl p-8 w-full max-w-lg">
            <h3 class="text-2xl font-bold mb-4 text-custom">Novo Item de Inventário</h3>
            <form id="inventoryForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="itemName" placeholder="Nome do Item" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom" required>
                    <select id="itemType" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom"><option>Amostra Biológica</option><option>Reagente</option><option>Consumível</option></select>
                    <input type="text" id="itemLot" placeholder="Número do Lote" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom">
                    <div><label class="text-xs text-gray-400">Data de Validade</label><input type="date" id="itemExpiry" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom"></div>
                    <input type="text" id="itemLocation" placeholder="Localização (Ex: F-80.P1)" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom" required>
                    <input type="text" id="itemQuantity" placeholder="Quantidade (Ex: 10 uL)" class="w-full px-3 py-2 border border-custom rounded-lg bg-custom text-custom" required>
                </div>
                <div class="flex justify-end space-x-4 mt-6">
                    <button type="button" class="close-modal-btn px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

     <div id="qrCodeModal" class="fixed inset-0 flex items-center justify-center hidden modal-backdrop z-40">
        <div class="card-custom rounded-lg shadow-xl p-8 text-center">
            <h3 class="text-2xl font-bold mb-4 text-custom">Item Adicionado!</h3>
            <div id="qrcode-container" class="flex justify-center p-4 bg-white rounded-lg"></div>
            <p id="qrcode-item-name" class="font-semibold mt-4 text-custom"></p>
            <button type="button" class="close-modal-btn mt-6 px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Fechar</button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
